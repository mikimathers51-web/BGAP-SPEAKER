name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Versi
        run: |
          echo "VERSION_CODE=$((40 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=3.11.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Tes unit parser + aturan diagnosa. Gagal tes tidak menghalangi APK, tetapi laporan diunggah.
      - name: Unit test
        id: unit
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Tas5805mCtrl-${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tas5805mCtrl-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rilis GitHub (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Peringatan bila tes gagal
        if: steps.unit.outcome == 'failure'
        run: echo "::warning::Unit test GAGAL — lihat artifact unit-test-report"
